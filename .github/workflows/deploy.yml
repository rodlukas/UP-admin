name: Build & Deploy

on:
    push:
        tags: ["*"]

# Deploye se RADI DO FRONTY, nikdy se nerusi -- zruseni uprostred `flyctl deploy`
# necha produkci rozjetou mezi dvema verzemi.
concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    contents: read

env:
    ENVIRONMENT: CI-deploy
    SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    GA4_ID: ${{ secrets.GA4_ID }}
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    DJANGO_SETTINGS_MODULE: up.settings.production
    MANUAL_PRODUCTION: True
    SECRET_KEY: ${{ secrets.SECRET_KEY }}
    GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    REGISTRY: ghcr.io

jobs:
    build_and_deploy:
        name: Build & Deploy
        runs-on: ubuntu-26.04
        timeout-minutes: 40

        # github token opravneni pro upload k releasum/do container registru
        permissions:
            contents: write
            packages: write

        steps:
            # priprav prostredi
            - name: ☁️ Checkout repo
              uses: actions/checkout@v7
            - name: 🔧 Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: "npm"
                  cache-dependency-path: "**/package-lock.json"
            - name: 🔧 Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
                  cache: "pipenv"

            # spust skripty pro upravu souboru
            - name: 📝 Create .npmrc file
              run: ./scripts/shell/ci/create_npmrc.sh
            - name: 📝 Apply string substitution
              run: ./scripts/shell/ci/string_substitution.sh
            - name: 📝 Create dummy .env file
              run: touch .env

            # Sentry musi mapy priradit ke stejnemu release, jaky hlasi aplikace -
            # string_substitution.sh dosazuje za %GIT_COMMIT kratky SHA
            - name: 📝 Export Sentry release
              run: echo "SENTRY_RELEASE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

            # nainstaluj JS zavislosti (postinstall hook buildne frontend a nahraje mapy do Sentry)
            - name: 🔧 JS - install deps & build frontend app
              run: npm ci
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

            # mapy frontendu uz jsou v Sentry a na verejnou URL nepatri. Maze se jen tahle
            # slozka: mapy tretich stran musi zustat, protoze jejich CSS na ne odkazuje
            # (napr. rest_framework/css/bootstrap.min.css) a collectstatic by jinak selhal
            - name: 🧹 Remove frontend source maps
              run: rm -f frontend/build/assets/*.map

            # nainstaluj Python zavislosti
            # bez --dev: deploy job krome collectstatic zadny vyvojovy nastroj nespousti
            - name: 🔧 Python - install deps
              run: |
                  pip install pipenv==2026.8.0 --only-binary :all:
                  pipenv install --deploy

            # priprav Django aplikaci
            # DEPLOYED drzi debug_toolbar mimo INSTALLED_APPS, jinak se do image sesbira
            # i jeho statika
            - name: 🔧 Python - build Django app (staticfiles)
              run: pipenv run python manage.py collectstatic --noinput
              env:
                  DEPLOYED: True

            # zabal frontend do zipu pro GH a nahraj
            - name: ✨ Pre-deploy tasks Github Releases
              run: ./scripts/shell/ci/create_frontend_zip.sh
            - name: 🚀 Upload build artifacts to GitHub Releases
              uses: softprops/action-gh-release@v3
              with:
                  files: frontend.zip
            - name: 🧹 Post-deploy tasks Github Releases
              run: ./scripts/shell/ci/remove_frontend_zip.sh

            # smazani dat z buildu, testovani a dokumentace
            - name: 🧹 Cleanup project folder
              run: ./scripts/shell/ci/cleanup.sh

            # nastavime spravnou fly.io konfiguraci
            - name: 🧹 Pre-deploy tasks Fly.io
              run: mv fly.prod.toml fly.toml

            # pripravime fly.io klienta pro deploy
            - name: 🧹 Pre-deploy tasks Fly.io - client
              uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08 (= v1 / 1.6)

            # nasazeni prod verze na Fly.io
            - name: 🚀 Deploy to prod Fly.io
              if: ${{ github.actor != 'dependabot[bot]' }}
              run: flyctl deploy --remote-only
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}

            # nahrani kontejneru s app do container registru
            - name: 🔧 Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: 🔧 Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}
            - name: 🚀 Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
