name: Build & Test

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

env:
    ENVIRONMENT: CI-test
    SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    DJANGO_SETTINGS_MODULE: up.settings.production
    MANUAL_PRODUCTION: True
    SECRET_KEY: ${{ secrets.SECRET_KEY }}
    GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

# Beh je rozdeleny do tri fazi, protoze frontend build musi predchazet UI testum
# a deploy je musi nasledovat: build -> (test_backend | test_ui x N) -> deploy.
# Frontend se tim buildi jen jednou (a jen jednou nahraje mapy do Sentry), UI stage
# jede paralelne. Rozdeleni UI stage na shardy drzi .github/ui-shards.json.
jobs:
    build:
        name: Build
        runs-on: ubuntu-26.04
        outputs:
            ui_shards: ${{ steps.shards.outputs.list }}

        steps:
            # priprav prostredi
            - name: ☁️ Checkout repo
              uses: actions/checkout@v7
              with:
                  # pro PR checkoutni commit z PR branch místo merge commitu
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: 🔧 Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: "npm"
                  cache-dependency-path: "**/package-lock.json"
            - name: 🔧 Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
                  cache: "pipenv"

            # padni driv, nez se cokoliv zacne buildit
            - name: 🔍 Verify UI shards cover every feature file
              run: ./scripts/shell/ci/check_ui_shards.sh
            - name: 📋 Read UI shards
              id: shards
              run: echo "list=$(jq -c . .github/ui-shards.json)" >> "$GITHUB_OUTPUT"

            # spust skripty pro upravu souboru
            - name: 📝 Create .npmrc file
              run: ./scripts/shell/ci/create_npmrc.sh
            - name: 📝 Apply string substitution
              run: ./scripts/shell/ci/string_substitution.sh
            - name: 📝 Create dummy .env file
              run: touch .env

            # Sentry musi mapy priradit ke stejnemu release, jaky hlasi aplikace -
            # string_substitution.sh dosazuje za %GIT_COMMIT kratky SHA
            - name: 📝 Export Sentry release
              run: echo "SENTRY_RELEASE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

            # nainstaluj JS zavislosti (postinstall hook buildne frontend a nahraje mapy do Sentry)
            - name: 🔧 JS - install deps & build frontend app
              run: npm ci
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

            # mapy frontendu uz jsou v Sentry a na verejnou URL nepatri. Maze se jen tahle
            # slozka: mapy tretich stran musi zustat, protoze jejich CSS na ne odkazuje
            # (napr. rest_framework/css/bootstrap.min.css) a collectstatic by jinak selhal
            - name: 🧹 Remove frontend source maps
              run: rm -f frontend/build/assets/*.map

            # nainstaluj Python zavislosti
            - name: 🔧 Python - install deps
              run: |
                  pip install pipenv==2026.8.0 --only-binary :all:
                  pipenv install --deploy --dev

            # spust audit frontendu
            - name: 🔍 JS - run audit
              continue-on-error: true
              run: npm run frontend:audit

            # otestuj frontend (typy, linting, jest)
            - name: 🔍 JS - run tests
              run: npm run frontend:test

            # zkontroluj formatovani v backendu pres black (rychla kontrola, spustit pred pomalejsim mypy)
            - name: 🔍 Python - check formatting (Black)
              run: pipenv run black --check .

            # otestuj typy v backendu pres mypy
            - name: 🔍 Python - run tests
              run: pipenv run mypy .

            # collectstatic nepotrebuje DB, takze patri sem - deploy si pak vystaci se
            # stazenym artefaktem a nemusi vubec instalovat Python zavislosti
            - name: 🔧 Python - collect staticfiles
              run: DEPLOYED=True pipenv run python manage.py collectstatic --noinput

            # Vysledek buildu si stahuji testovaci joby i deploy: frontend/build kvuli
            # STATICFILES_DIRS (production.py pod MANUAL_PRODUCTION), vygenerovana sablona
            # je shell SPA a staticfiles jde rovnou do image.
            - name: ⬆️ Upload build output
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: |
                      frontend/build
                      staticfiles
                      admin/templates/react-autogenerate.html
                  if-no-files-found: error
                  retention-days: 1

    test_backend:
        name: Test - backend & API
        needs: build
        runs-on: ubuntu-26.04

        steps:
            - name: ☁️ Checkout repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: 🔧 Prepare test environment
              uses: ./.github/actions/test-env

            # spust Django deployment checklist
            - name: 🔍 Python - run Django deployment checklist
              env:
                  MANUAL_PRODUCTION: False
              run: pipenv run python manage.py check --deploy --fail-level WARNING

            - name: 🐞 Debug env log
              run: |
                  python --version
                  pipenv --version
                  docker exec postgresql_cz psql -U postgres -c "SELECT datcollate, datctype FROM pg_database WHERE datname = current_database();"
                  docker exec postgresql_cz psql --version

            # proved testy, spocitej pokryti kodu a posli ho do cloudu
            - name: 🔍 Python - run tests
              run: pipenv run coverage run -a manage.py test
            - name: 🔍 Run E2E API tests
              run: pipenv run coverage run -a manage.py behave --stage=api --format=progress3
            - name: 📝 Generate test reports
              run: |
                  pipenv run coverage report
                  pipenv run coverage xml
            - name: ☁️ Upload code coverage
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml
                  # kazdy job posila vlastni report, Codecov si je slouci - bez rozlisujiciho
                  # jmena by se v UI prekryvaly
                  name: backend
                  fail_ci_if_error: false

    test_ui:
        name: Test - E2E UI
        needs: build
        runs-on: ubuntu-26.04
        strategy:
            # jeden padajici shard nesmi sebrat vysledek ostatnich
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(needs.build.outputs.ui_shards) }}

        steps:
            - name: ☁️ Checkout repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: 🔧 Prepare test environment
              uses: ./.github/actions/test-env

            - name: 🐞 Debug env log
              run: |
                  firefox --version
                  geckodriver --version

            # shard jde pres env, ne interpolaci do shellu - hodnota se tim nedostane
            # do skriptu jako kod
            - name: 🔍 Run E2E UI tests
              env:
                  SHARD: ${{ matrix.shard }}
              run: |
                  features=""
                  for feature in $SHARD; do
                      features="$features tests/features/$feature.feature"
                  done
                  pipenv run coverage run -a manage.py behave --stage=ui --format=progress3 $features
            - name: 📝 Generate test reports
              run: |
                  pipenv run coverage report
                  pipenv run coverage xml
            - name: ☁️ Upload code coverage
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml
                  # nazev musi byt unikatni i mezi shardy, jinak si reporty prepisou
                  name: ui-${{ strategy.job-index }}
                  fail_ci_if_error: false

    deploy:
        name: Deploy to test Fly.io
        needs: [test_backend, test_ui]
        if: ${{ github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-26.04

        steps:
            - name: ☁️ Checkout repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: ⬇️ Download build output
              uses: actions/download-artifact@v4
              with:
                  name: build-output

            # do image jde uz nasubstituovany kod (up/); frontend build i staticfiles
            # nesou hodnoty dosazene uz v build jobu
            - name: 📝 Apply string substitution
              run: ./scripts/shell/ci/string_substitution.sh

            # smazani dat z buildu, testovani a dokumentace
            - name: 🧹 Cleanup project folder
              run: ./scripts/shell/ci/cleanup.sh

            # nastavime spravnou fly.io konfiguraci
            - name: 🧹 Pre-deploy tasks Fly.io - config files
              run: mv fly.test.toml fly.toml

            # pripravime fly.io klienta pro deploy
            - name: 🧹 Pre-deploy tasks Fly.io - client
              uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08 (= v1 / 1.6)

            # nasazeni testing verze na Fly.io
            - name: 🚀 Deploy to test Fly.io
              run: flyctl deploy --remote-only
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_TEST }}

    # Branch protection vyzaduje jeden status check pevneho jmena. Vyjmenovat v nem
    # primo joby matice nejde rozumne udrzovat - jejich jmena se meni s kazdou upravou
    # .github/ui-shards.json a pravidlo by se muselo prepisovat s nimi (a dokud by se
    # nezmenilo, PR by cekal na check, ktery uz nikdo nenahlasi). Tenhle job je proto
    # jediny pozadovany check a jen shrnuje vysledek vsech ostatnich.
    build_and_test:
        name: Build & Test
        needs: [build, test_backend, test_ui, deploy]
        # musi dobehnout i kdyz nektery z jobu selhal - jinak by se preskocil a check
        # by zase nikdo nenahlasil
        if: ${{ always() }}
        runs-on: ubuntu-26.04

        steps:
            # "skipped" je v poradku: deploy se preskakuje pro Dependabota a preskoceni
            # kvuli spadlemu predchudci odhali vysledek toho predchudce
            - name: 🔍 Verify all jobs succeeded
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "vysledky jobu: $RESULTS"
                  for result in $RESULTS; do
                      case "$result" in
                          success | skipped) ;;
                          *)
                              echo "::error::Nektery job skoncil jako \"$result\"."
                              exit 1
                              ;;
                      esac
                  done
                  echo "✅ Vsechny joby probehly."
