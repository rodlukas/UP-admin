version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/frontend"
      registries:
          - npm-github
      schedule:
          interval: "daily"
      groups:
          npm-all:
              patterns:
                  - "*"
      ignore:
          # TypeScript 7 je nativni Go port a neexportuje klasicke API (v "exports" je jen
          # ./lib/version.cjs a ./unstable/*), takze type-aware linting na nem nebezi -
          # @typescript-eslint ma peer ">=4.8.4 <6.1.0" a pri TS 7 rovnou spadne.
          # Az podporu doda (typescript-eslint/typescript-eslint#10940, mirene na TS >=7.1),
          # tohle pravidlo smaz.
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "daily"
      groups:
          pip-all:
              patterns:
                  - "*"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      groups:
          github-actions-all:
              patterns:
                  - "*"
registries:
    npm-github:
        type: npm-registry
        url: https://npm.pkg.github.com
        scope: "@rodlukas"
        token: ${{ secrets.GPR_TOKEN }}
