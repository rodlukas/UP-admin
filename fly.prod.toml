app = "uspesnyprvnacek"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "fra"
# Stroj jede blizko stropu 256 MB a nema swap, takze prechodna spicka konci OOM killem
# misto zpomaleni. Swap je pojistka, ne misto pro bezny provoz - bere se z rootfs.
swap_size_mb = 512

[experimental]
auto_rollback = true

[deploy]
release_command = "sh -c 'python manage.py migrate --noinput && python manage.py createcachetable'"

[env]
BANK_ACTIVE = "True"
DEBUG = "False"
DEPLOYED = "True"
DJANGO_SETTINGS_MODULE = "up.settings.production"
ENVIRONMENT = "prod-fly"
PORT = "8000"

[[services]]
internal_port = 8000
processes = ["app"]
protocol = "tcp"

[[services.ports]]
force_https = true
handlers = ["http"]
port = 80

[[services.ports]]
handlers = ["tls", "http"]
port = 443
[services.concurrency]
hard_limit = 8
soft_limit = 6
type = "connections"

[[services.tcp_checks]]
grace_period = "1s"
interval = "15s"
restart_limit = 0
timeout = "2s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
